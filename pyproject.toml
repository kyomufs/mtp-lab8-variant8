[tool.poetry]
name = "mtp-lab8-variant8"
version = "1.0.0"
description = "Lab 8: TDD calculator, argparse CLI, MVC, FastAPI microservice, AI client"
authors = ["Самодуров Матвей Николаевич <kyomufsdev@gmail.com>"]
packages = [{ include = "lab8" }]

[tool.poetry.dependencies]
python = "^3.12"
fastapi = ">=0.115.0"
pydantic = ">=2.7.0"

[tool.poetry.group.dev.dependencies]
pytest = ">=8.0"
flake8 = ">=7.0"
httpx = ">=0.27"

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = [
    "ignore:Using `httpx` with `starlette.testclient` is deprecated",
]
